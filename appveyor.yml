image: Visual Studio 2026

before_build:
  - dotnet restore AssetStudio.sln

install:
  - ps: |
      md fbx
      cd fbx
      Start-FileDownload "https://damassets.autodesk.net/content/dam/autodesk/www/adn/fbx/2020-2-1/fbx202021_fbxsdk_vs2019_win.exe" "fbxsdk.exe"
      Start-Process -FilePath "fbxsdk.exe" -ArgumentList "/S" -Wait
      cd ..

build_script:
  - dotnet publish AssetStudioCLI\AssetStudioCLI.csproj -c Release -o AssetStudioCLI\bin\Release\net10.0\publish
  - dotnet publish AssetStudioGUI\AssetStudioGUI.csproj -c Release -o AssetStudioGUI\bin\Release\net10.0-windows\win-x64\publish

artifacts:
  - path: AssetStudioCLI\bin\Release\net10.0\publish
    name: AssetStudioCLI
  - path: AssetStudioGUI\bin\Release\net10.0-windows\win-x64\publish
    name: AssetStudioGUI
